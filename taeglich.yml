name: DAV Alpinbibliothek – tägliche Suche

on:
  schedule:
    - cron: '15 8 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dav-bibliothek
  cancel-in-progress: false

jobs:
  suchen-und-mailen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GMX_USERNAME: ${{ secrets.GMX_USERNAME }}
      GMX_PASSWORD: ${{ secrets.GMX_PASSWORD }}
      EMAIL_TO: csmitty@gmx.net
      DAV_SUCHBEGRIFF_1: Alpin-Lehrplan
      DAV_SUCHBEGRIFF_2: Skibergsteigen
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Dateien laden
        uses: actions/checkout@v4
      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Bibliothek durchsuchen und E-Mail senden
        run: python bot.py
      - name: Bericht zu Diagnosezwecken speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dav-bibliothek-bericht
          path: ausgabe/
          if-no-files-found: ignore
          retention-days: 7
